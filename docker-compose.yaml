version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aquascape-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth-network

  clamav:
    image: clamav/clamav:latest
    container_name: aquascape-clamav
    restart: always
    networks:
      - auth-network
    # Không cần export port ra ngoài host trừ khi bạn muốn scan từ máy thật
    # ports:
    #   - "3310:3310"

  spring-app:
    build: .
    container_name: aquascape-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      - postgres
    networks:
      - auth-network
volumes:
  postgres_data:

networks:
  auth-network:
    driver: bridge