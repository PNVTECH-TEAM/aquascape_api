name: Build and Deploy to Render

on:
  push:
    branches: [ 'main', 'develop', 'feature/PNVTECH-150-scan-uploaded-glb-files' ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        build-args: |
          DATABASE_URL=postgresql://user:pass@localhost:5432/db?sslmode=require
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/aquascape-api:latest
          ${{ secrets.DOCKER_USERNAME }}/aquascape-api:${{ github.sha }}
    
    - name: Deploy to GCP VM via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.GCP_VM_IP }}
        username: ${{ secrets.GCP_VM_USER }}
        key: ${{ secrets.GCP_SSH_KEY }}
        script: |
          docker stop aquascape-api || true
          docker rm aquascape-api || true
          docker system prune -af || true
          docker pull ${{ secrets.DOCKER_USERNAME }}/aquascape-api:latest
          docker run -d \
            --name aquascape-api \
            --restart always \
            -v /tmp:/tmp \
            -p 8080:8080 \
            -e SPRING_DATASOURCE_URL="${{ secrets.DATABASE_URL }}" \
            -e SPRING_DATASOURCE_USERNAME="${{ secrets.DATABASE_USERNAME }}" \
            -e SPRING_DATASOURCE_PASSWORD="${{ secrets.DATABASE_PASSWORD }}" \
            -e AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            -e AZURE_STORAGE_CONTAINER_NAME="${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}" \
            -e REDIS_HOST="${{ secrets.REDIS_HOST }}" \
            -e REDIS_PORT="${{ secrets.REDIS_PORT }}" \
            -e REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
            -e REDIS_SSL="${{ secrets.REDIS_SSL }}" \
            ${{ secrets.DOCKER_USERNAME }}/aquascape-api:latest