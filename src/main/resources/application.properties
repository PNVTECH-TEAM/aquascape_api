spring.application.name=aquascape
server.port=8080
logging.level.org.springframework.security=DEBUG

# Database
spring.datasource.url=jdbc:postgresql://postgres:5432/authdb
spring.datasource.username=admin
spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

# Azure Storage
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME}

# JWT
jwt.secret=your-secret-key-change-this-in-production-min-256-bits-required-for-security
jwt.expiration=86400000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.root=INFO
logging.level.com.example.aquascape=DEBUG

spring.servlet.multipart.max-file-size=50MB

spring.servlet.multipart.max-request-size=50MB